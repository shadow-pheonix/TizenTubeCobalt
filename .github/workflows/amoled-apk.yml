name: Build AMOLED APKs

on:
  workflow_dispatch:
  push:
    branches: [feature/amoled-pitch-black]
    tags: ['amoled-*']
    paths:
      - tools/amoled/**
      - .github/workflows/amoled-apk.yml
      - third_party/blink/renderer/core/dom/document.cc

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: tools/amoled
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download pinned official runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.0.3 --repo reisxd/TizenTubeCobalt --pattern 'cobalt-*.apk' --dir build/upstream
      - name: Check pinned feature bundle
        run: |
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/gh/shadow-pheonix/TizenTube@amoled01/u.js' --output build/userscript.js
          grep -q 'enableAmoledTheme' build/userscript.js
          node --check build/userscript.js
      - name: Package and sign both APKs
        env:
          AMOLED_KEYSTORE_BASE64: ${{ secrets.AMOLED_KEYSTORE_BASE64 }}
          AMOLED_STORE_PASSWORD: ${{ secrets.AMOLED_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/amoled-release.jks"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$AMOLED_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          for arch in arm64 arm; do
            python3 tools/amoled/build_apk.py \
              --arch "$arch" \
              --upstream-apk "build/upstream/cobalt-$arch.apk" \
              --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
              --keystore "$key_file" \
              --output "build/output/TizenTube-AMOLED-$arch.apk"
          done
          cd build/output
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: TizenTube-AMOLED-APKs
          path: |
            build/output/*.apk
            build/output/*.json
            build/output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish release APKs
        if: startsWith(github.ref, 'refs/tags/amoled-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/output/*.apk build/output/*.json build/output/SHA256SUMS --clobber
    permissions:
      contents: write
