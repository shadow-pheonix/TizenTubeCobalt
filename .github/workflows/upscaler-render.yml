name: Verify Android video upscaler
on:
  push:
    branches: [main, feature/amoled-pitch-black]
    paths: ['tools/amoled/**', 'cobalt/android/**', '.github/workflows/upscaler-render.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/amoled
            cobalt/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
          log-accepted-android-sdk-licenses: false
      - name: Install video fixture encoder
        run: |
          python3 -m pip install --only-binary=:all: --no-deps imageio-ffmpeg==0.6.0
      - run: python3 tools/amoled/build_render_test.py --sdk "$ANDROID_HOME" --output build/render-test
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/amoled/run_render_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-SGSR1-render-check
          path: build/render-results
